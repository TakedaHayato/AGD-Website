<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGD // OPERATIONS CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a; --text: #e6edf3; --accent: #00f0ff;
            --border: #1f2937; --card-bg: #0d1117; --terminal-green: #00ff41;
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); height: 100%; overflow-x: hidden; }

        /* --- NAVIGATION FIX --- */
        .glass-nav { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; height: 70px; background: rgba(13, 17, 23, 0.95); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 9999; }
        .brand { font-family: 'Orbitron'; color: var(--accent); font-weight: bold; font-size: 1.1rem; letter-spacing: 2px; cursor: pointer; }

        .nav-right { position: relative; display: flex; align-items: center; gap: 15px; }
        .hamburger { cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 10px; border: 1px solid var(--border); background: transparent; z-index: 10002; }
        .hamburger span { width: 20px; height: 1px; background: var(--accent); }

        .dropdown { 
            position: absolute; top: 60px; right: 0; background: var(--card-bg); 
            border: 1px solid var(--border); display: none; flex-direction: column; 
            min-width: 200px; z-index: 10001; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .dropdown.active { display: flex; }
        .dropdown a { padding: 15px; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); font-family: 'Orbitron'; font-size: 0.75rem; transition: 0.2s; }
        .dropdown a:hover { background: var(--accent); color: #000; }

        /* --- DASHBOARD GRID --- */
        .content { padding: 25px; max-width: 1800px; margin: 0 auto; min-height: calc(100vh - 70px); }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 450px; gap: 25px; }
        @media (max-width: 1200px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .page { display: none; }
        .page.active { display: block; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 4px; padding: 20px; margin-bottom: 20px; }
        .card-head { font-family: 'Orbitron'; color: var(--accent); border-left: 4px solid var(--accent); padding-left: 12px; margin-bottom: 20px; font-size: 0.9rem; text-transform: uppercase; }

        /* --- TERMINAL & USER --- */
        .user-profile-widget { display: flex; align-items: center; justify-content: flex-end; gap: 20px; margin-bottom: 20px; }
        .user-name-glitch { font-family: 'Orbitron'; color: var(--accent); font-size: 1.5rem; font-weight: bold; }
        .user-pfp { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--accent); background: #000; }

        .terminal-container { background: #000; border: 1px solid var(--border); height: 300px; font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--terminal-green); padding: 15px; overflow: hidden; position: relative; }
        #terminal-log { display: flex; flex-direction: column; gap: 4px; position: absolute; bottom: 15px; width: calc(100% - 30px); }

        /* --- CREDITS DISCORD STYLE --- */
        .team-list { display: flex; flex-direction: column; gap: 15px; }
        .team-member { display: flex; align-items: center; gap: 20px; padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 4px; transition: 0.3s; }
        .team-member:hover { border-color: var(--accent); background: rgba(0, 240, 255, 0.05); }
        .team-pfp { width: 55px; height: 55px; border-radius: 8px; border: 1px solid var(--border); background: #000; object-fit: cover; }
        .team-info { display: flex; flex-direction: column; }
        .team-name { font-family: 'Orbitron'; font-size: 1rem; color: var(--text); }
        .team-role { font-size: 0.75rem; color: var(--accent); opacity: 0.8; margin-top: 2px; }

        /* --- UI ELEMENTS --- */
        .radar-box { height: 500px; background: #000; border: 1px solid var(--border); }
        .login-btn { background: var(--accent); color: #000; border: none; padding: 18px 45px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body onclick="closeMenu()">

    <div id="welcome-screen" style="position:fixed; inset:0; background:#000; z-index:10000; display:flex; align-items:center; justify-content:center;">
        <button class="login-btn" onclick="login()">ESTABLISH UPLINK</button>
    </div>

    <div id="main-interface" class="hidden">
        <nav class="glass-nav">
            <div class="brand" onclick="showPage('home')">AGD // OPERATIONS CENTER</div>
            <div class="nav-right">
                <div class="hamburger" onclick="toggleMenu(event)">
                    <span></span><span></span><span></span>
                </div>
                <div id="dropdown" class="dropdown">
                    <a href="#" onclick="showPage('home')">DASHBOARD</a>
                    <a href="#" onclick="showPage('credits')">CREDITS</a>
                    <a href="#" onclick="logout()" style="color:#ff4444;">DISCONNECT</a>
                </div>
            </div>
        </nav>

        <main class="content">
            <section id="home" class="page active">
                <div class="dashboard-grid">
                    <div class="main-col">
                        <div class="card">
                            <div class="card-head">// TACTICAL_RADAR</div>
                            <div class="radar-box">
                                <iframe width="100%" height="100%" frameborder="0" src="https://embed.windy.com/embed2.html?lat=52.52&lon=13.40&zoom=6&overlay=rain&message=false"></iframe>
                            </div>
                        </div>
                    </div>
                    <div class="side-col">
                        <div class="card">
                            <div class="card-head">// AUTH_STATUS</div>
                            <div class="user-profile-widget">
                                <span id="display-name" class="user-name-glitch">---</span>
                                <img id="display-avatar" class="user-pfp" src="">
                            </div>
                            <div class="terminal-container">
                                <div id="terminal-log"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="credits" class="page">
                <div class="card">
                    <div class="card-head">// PROJECT_STRUCTURE</div>
                    <div class="team-list">
                        <div class="team-member">
                            <img id="credit-hayato" class="team-pfp" src="https://cdn.discordapp.com/embed/avatars/0.png">
                            <div class="team-info">
                                <span class="team-name">HAYATO</span>
                                <span class="team-role">OWNER / ARCHITECT</span>
                            </div>
                        </div>
                        <div class="team-member">
                            <img id="credit-lionel" class="team-pfp" src="https://cdn.discordapp.com/embed/avatars/1.png">
                            <div class="team-info">
                                <span class="team-name">LIONEL</span>
                                <span class="team-role">DEVELOPER (ID: 1400867817951072428)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const CLIENT_ID = '1292148049358884905';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        // Navigation Logik
        function toggleMenu(e) { 
            e.stopPropagation(); 
            document.getElementById('dropdown').classList.toggle('active'); 
        }
        
        function closeMenu() { 
            document.getElementById('dropdown').classList.remove('active'); 
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            closeMenu();
        }

        // Hacker Terminal Logik
        function startTerminal() {
            const log = document.getElementById('terminal-log');
            const lines = ["INIT_UPLINK...", "FETCHING_ASSETS", "DECRYPTING_COMM_CHANNELS", "PING: 14ms", "ACCESS_GRANTED", "SYNCING_RADAR_DATA"];
            setInterval(() => {
                const div = document.createElement('div');
                div.innerText = `> ${lines[Math.floor(Math.random() * lines.length)]} [${Math.random().toString(16).substring(2,6).toUpperCase()}]`;
                log.appendChild(div);
                if (log.children.length > 12) log.removeChild(log.firstChild);
            }, 500);
        }

        // Discord Login & Profilbilder
        async function init() {
            const hash = new URLSearchParams(window.location.hash.slice(1));
            let token = hash.get('access_token') || localStorage.getItem('agd_token');

            if (token) {
                try {
                    const res = await fetch('https://discord.com/api/users/@me', {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    const user = await res.json();
                    localStorage.setItem('agd_token', token);
                    
                    document.getElementById('welcome-screen').classList.add('hidden');
                    document.getElementById('main-interface').classList.remove('hidden');
                    
                    // User Profil
                    const pfpUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
                    document.getElementById('display-name').innerText = user.username.toUpperCase();
                    document.getElementById('display-avatar').src = pfpUrl;

                    // Credits Bilder (Laden per ID)
                    // Da man ohne Bot-Token keine fremden User-Daten per ID ziehen kann, 
                    // laden wir das Bild von Lionel/Hayato nur korrekt, wenn die ID bekannt ist oder sie selbst eingeloggt sind.
                    // Falls Hayato eingeloggt ist:
                    if(user.id === "444127208735506433") document.getElementById('credit-hayato').src = pfpUrl;
                    if(user.id === "1400867817951072428") document.getElementById('credit-lionel').src = pfpUrl;
                    
                    // Statische Links für die Avatare (Falls vorhanden, sonst Default)
                    // Ersetze diese URLs durch echte Bild-Links oder GIFs
                    document.getElementById('credit-hayato').src = `https://cdn.discordapp.com/avatars/444127208735506433/a_df259e829377488b398646b9a89c927b.gif?size=128`; // Beispiel für GIF
                    document.getElementById('credit-lionel').src = `https://cdn.discordapp.com/avatars/1400867817951072428/a_e6edf3.gif?size=128`; 

                    startTerminal();
                } catch (e) { localStorage.removeItem('agd_token'); }
                window.history.replaceState({}, document.title, REDIRECT_URI);
            }
        }

        function login() { window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify+guilds.join`; }
        function logout() { localStorage.removeItem('agd_token'); window.location.reload(); }

        init();
    </script>
</body>
</html>
