<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGD // OPERATIONS CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a; --text: #e6edf3; --accent: #00f0ff;
            --border: #1f2937; --card-bg: #0d1117; --terminal-green: #00ff41;
        }
        body.light-theme {
            --bg: #f0f4f8; --text: #1a202c; --accent: #0284c7;
            --border: #cbd5e1; --card-bg: #ffffff; --terminal-green: #0369a1;
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); height: 100%; transition: 0.3s; }

        /* --- NAVIGATION --- */
        .glass-nav { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 70px; background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 9999; }
        .brand { font-family: 'Orbitron'; color: var(--accent); font-weight: bold; cursor: pointer; }
        
        .nav-controls { display: flex; align-items: center; gap: 10px; }
        .nav-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 15px; font-family: 'Orbitron'; font-size: 0.7rem; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* --- DROPDOWN --- */
        .nav-right { position: relative; }
        .hamburger { cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
        .hamburger span { width: 20px; height: 2px; background: var(--accent); }
        .dropdown { 
            position: absolute; top: 60px; right: 0; background: var(--card-bg); 
            border: 1px solid var(--border); display: none; flex-direction: column; 
            min-width: 180px; z-index: 10001;
        }
        .dropdown.active { display: flex; }
        .dropdown button { padding: 12px; color: var(--text); border: none; border-bottom: 1px solid var(--border); font-family: 'Orbitron'; font-size: 0.7rem; text-align: left; background: transparent; cursor: pointer; }
        .dropdown button:hover { background: var(--accent); color: #000; }

        /* --- DASHBOARD --- */
        .content { padding: 20px; max-width: 1600px; margin: 0 auto; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 400px; gap: 20px; }
        @media (max-width: 1100px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .page { display: none; }
        .page.active { display: block; }
        .card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; border-radius: 4px; }
        .card-head { font-family: 'Orbitron'; color: var(--accent); border-left: 3px solid var(--accent); padding-left: 10px; margin-bottom: 15px; font-size: 0.8rem; text-transform: uppercase; }

        /* --- TEAM CREDITS FIX --- */
        .team-member { display: flex; align-items: center; gap: 15px; padding: 15px; background: rgba(128,128,128,0.05); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
        .team-pfp { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--accent); background: #000; object-fit: cover; }

        /* --- TERMINAL --- */
        .terminal-container { background: #000 !important; border: 1px solid var(--border); height: 250px; font-family: 'Courier New', monospace; font-size: 0.75rem; color: var(--terminal-green); padding: 10px; overflow: hidden; position: relative; }
        #terminal-log { display: flex; flex-direction: column; position: absolute; bottom: 10px; width: 95%; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="welcome-screen" style="position:fixed; inset:0; background:#000; z-index:10000; display:flex; align-items:center; justify-content:center;">
        <button class="nav-btn" style="padding:20px 40px; font-size:1rem;" onclick="login()">ESTABLISH UPLINK</button>
    </div>

    <div id="main-interface" class="hidden">
        <nav class="glass-nav">
            <div class="brand" onclick="showPage('home')">AGD // OPS</div>
            <div class="nav-controls">
                <button class="nav-btn" onclick="showPage('home')">Home</button>
                <button class="nav-btn" id="lang-btn" onclick="toggleLang()">EN</button>
                <button class="nav-btn" onclick="toggleTheme()">🌓</button>
                <div class="nav-right">
                    <div class="hamburger" onclick="toggleMenu(event)"><span></span><span></span></div>
                    <div id="dropdown" class="dropdown">
                        <button onclick="showPage('home')" class="t-dash">DASHBOARD</button>
                        <button onclick="showPage('credits')" class="t-cred">CREDITS</button>
                        <button onclick="logout()" style="color:#ff4444;" class="t-disco">DISCONNECT</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="content">
            <section id="home" class="page active">
                <div class="dashboard-grid">
                    <div class="main-col">
                        <div class="card">
                            <div class="card-head t-radar">// TACTICAL_RADAR</div>
                            <iframe width="100%" height="450" frameborder="0" src="https://embed.windy.com/embed2.html?lat=52.52&lon=13.40&zoom=6&overlay=rain"></iframe>
                        </div>
                        <div class="card">
                            <div class="card-head t-comm">// LIVE_COMMUNICATIONS</div>
                            <iframe src="https://discord.com/widget?id=1129433598253084826&theme=dark" width="100%" height="400" frameborder="0"></iframe>
                        </div>
                    </div>
                    <div class="side-col">
                        <div class="card">
                            <div class="card-head t-auth">// AUTH_STATUS</div>
                            <div style="display:flex; align-items:center; justify-content:flex-end; gap:15px; margin-bottom:15px;">
                                <span id="display-name" style="font-family:Orbitron; font-weight:bold; color:var(--accent);">---</span>
                                <img id="display-avatar" style="width:60px; height:60px; border-radius:50%; border:2px solid var(--accent);">
                            </div>
                            <div class="terminal-container">
                                <div id="terminal-log"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="credits" class="page">
                <div class="card">
                    <div class="card-head t-struct">// PROJECT_STRUCTURE</div>
                    
                    <div class="team-member">
                        <img class="team-pfp" id="img-hayato" src="https://cdn.discordapp.com/avatars/444127208735506433/a_df259e829377488b398646b9a89c927b.gif?size=128" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                        <div>
                            <div style="font-family:Orbitron; font-weight:bold;">HAYATO</div>
                            <div style="font-size:0.75rem; color:var(--accent);">OWNER / ARCHITECT</div>
                        </div>
                    </div>

                    <div class="team-member">
                        <img class="team-pfp" id="img-lionel" src="https://cdn.discordapp.com/avatars/1400867817951072428/a_e6edf3.gif?size=128" onerror="this.src='https://cdn.discordapp.com/embed/avatars/1.png'">
                        <div>
                            <div style="font-family:Orbitron; font-weight:bold;">LIONEL</div>
                            <div style="font-size:0.75rem; color:var(--accent);">DEVELOPER</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const CLIENT_ID = '1292148049358884905';
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        let currentLang = 'DE';

        const translations = {
            'DE': { 'dash': 'DASHBOARD', 'cred': 'CREDITS', 'disco': 'TRENNEN', 'radar': '// TAKTISCHER_RADAR', 'comm': '// LIVE_KOMMUNIKATION', 'auth': '// AUTH_STATUS', 'struct': '// PROJEKT_STRUKTUR' },
            'EN': { 'dash': 'DASHBOARD', 'cred': 'CREDITS', 'disco': 'DISCONNECT', 'radar': '// TACTICAL_RADAR', 'comm': '// LIVE_COMMS', 'auth': '// AUTH_STATUS', 'struct': '// PROJECT_STRUCTURE' }
        };

        function toggleLang() {
            currentLang = currentLang === 'DE' ? 'EN' : 'DE';
            document.getElementById('lang-btn').innerText = currentLang === 'DE' ? 'EN' : 'DE';
            const t = translations[currentLang];
            document.querySelectorAll('.t-dash').forEach(el => el.innerText = t.dash);
            document.querySelectorAll('.t-cred').forEach(el => el.innerText = t.cred);
            document.querySelectorAll('.t-disco').forEach(el => el.innerText = t.disco);
            document.querySelector('.t-radar').innerText = t.radar;
            document.querySelector('.t-comm').innerText = t.comm;
            document.querySelector('.t-auth').innerText = t.auth;
            document.querySelector('.t-struct').innerText = t.struct;
        }

        function toggleTheme() { document.body.classList.toggle('light-theme'); }
        function toggleMenu(e) { e.stopPropagation(); document.getElementById('dropdown').classList.toggle('active'); }
        function closeMenu() { document.getElementById('dropdown').classList.remove('active'); }
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            closeMenu();
        }

        function startTerminal() {
            const log = document.getElementById('terminal-log');
            const lines = ["UPLINK_STABLE", "NODE_ACTIVE", "ENCRYPTING...", "SYNC_OK", "NO_BREACH"];
            setInterval(() => {
                const div = document.createElement('div');
                div.innerText = `> ${lines[Math.floor(Math.random() * lines.length)]} [${Math.random().toString(16).substring(2,5).toUpperCase()}]`;
                log.appendChild(div);
                if (log.children.length > 8) log.removeChild(log.firstChild);
            }, 800);
        }

        async function init() {
            const hash = new URLSearchParams(window.location.hash.slice(1));
            let token = hash.get('access_token') || localStorage.getItem('agd_token');
            if (token) {
                try {
                    const res = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } });
                    const user = await res.json();
                    localStorage.setItem('agd_token', token);
                    document.getElementById('welcome-screen').classList.add('hidden');
                    document.getElementById('main-interface').classList.remove('hidden');
                    document.getElementById('display-name').innerText = user.username.toUpperCase();
                    const isGif = user.avatar && user.avatar.startsWith('a_');
                    document.getElementById('display-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${isGif ? 'gif' : 'png'}?size=128`;
                    startTerminal();
                } catch (e) { localStorage.removeItem('agd_token'); }
                window.history.replaceState({}, document.title, REDIRECT_URI);
            }
        }

        function login() { window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`; }
        function logout() { localStorage.removeItem('agd_token'); window.location.reload(); }

        init();
        document.addEventListener('click', (e) => { if (!e.target.closest('.nav-right')) closeMenu(); });
    </script>
</body>
</html>
