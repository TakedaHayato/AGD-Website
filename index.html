<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGD OPERATIONS CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="welcome-screen">
        <div class="login-box">
            <img src="assets/AGDlogo.gif" class="welcome-logo" alt="AGD Logo">
            <h1 class="glitch-title">AGD OPS</h1>
            <button id="login-btn-welcome" class="main-start-btn">LOGIN WITH DISCORD</button>
        </div>
    </div>

    <div id="main-interface" style="display: none;">
        <nav class="glass-nav">
            <div class="nav-left">
                <button id="home-quick-btn" class="control-btn-pro">🏠</button>
                <span class="brand-text">AGD // OPS</span>
            </div>
            <div class="nav-right">
                <button id="mode-toggle" class="control-btn-pro">🖥️ AUTO</button>
                <button id="theme-toggle" class="control-btn-pro">🌓</button>
                <button id="menu-toggle" class="control-btn-pro">MENU</button>
                <div id="nav-menu" class="nav-dropdown">
                    <a href="#home" class="nav-link-item">DASHBOARD</a>
                    <a href="#gallery" class="nav-link-item">ARCHIVE</a>
                    <a href="#updates" class="nav-link-item">UPDATES</a>
                    <a href="#" id="logout-btn" class="nav-link-item" style="color:#ff4444;">LOGOUT</a>
                </div>
            </div>
        </nav>

        <main class="content">
            <section id="home" class="page active">
                <div class="dashboard-grid">
                    <div class="card wide">
                        <h3 class="card-head">// RADAR UPLINK</h3>
                        <div class="stat-info">TEMP: <span id="w-temp">--</span>°C | HUM: <span id="w-hum">--</span>%</div>
                        <div class="iframe-container"><iframe id="radar-iframe" frameborder="0"></iframe></div>
                    </div>
                    <div class="card">
                        <h3 class="card-head">// STATUS</h3>
                        <div id="user-profile" style="display:none; align-items:center; gap:10px;">
                            <img id="user-avatar" src="" style="width:40px; border-radius:50%;">
                            <span id="user-name">---</span>
                        </div>
                        <p>ID: <span id="display-id" style="color:var(--accent);">---</span></p>
                        <p>ZONE: <span style="color:#00ff00;">ONLINE</span></p>
                    </div>
                    <div class="card full">
                        <h3 class="card-head">// COMMS CHANNEL</h3>
                        <iframe src="https://discord.com/widget?id=1129433598253084826&theme=dark" width="100%" height="250" frameborder="0"></iframe>
                    </div>
                </div>
            </section>

            <section id="gallery" class="page">
                <h2 class="section-title">// DATA ARCHIVE</h2>
                <div class="archive-year">/ 2026</div>
                <div class="dashboard-grid"><div class="card placeholder-img">NO RECORDS FOUND</div></div>
            </section>
        </main>

        <footer class="bottom-bar">
            <a href="#credits" class="footer-link">CREDITS</a>
            <a href="#legal" class="footer-link">LEGAL</a>
            <div class="footer-copy">Aegis Global Defense © 2026</div>
        </footer>
    </div>

    <script src="theme.js"></script>
</body>
</html>
