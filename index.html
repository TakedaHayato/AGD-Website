<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGD OPERATIONS CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scanline"></div>

    <div id="welcome-screen">
        <div class="login-box">
            <img src="assets/AGDlogo.gif" class="welcome-logo" alt="AGD Logo">
            <h1 class="glitch" data-text="AGD OPERATIONS">AGD OPERATIONS</h1>
            <p class="status-text">SYSTEM: <span class="blink">LOCKED</span></p>
            <button id="login-btn-welcome" class="main-start-btn">ESTABLISH UPLINK</button>
        </div>
    </div>

    <div id="main-interface" style="display: none;">
        <nav class="glass-nav">
            <div class="nav-left">
                <button id="home-quick-btn" class="control-btn-pro">🏠</button>
                <span class="brand-text">AGD // <span class="blink">OPS</span></span>
            </div>
            <div class="nav-right">
                <button id="mode-toggle" class="control-btn-pro">🖥️ AUTO</button>
                <button id="theme-toggle" class="control-btn-pro">🌓</button>
                <button id="menu-toggle" class="control-btn-pro">MENU</button>
                <div id="nav-menu" class="nav-dropdown">
                    <a href="#home" class="nav-link-item">DASHBOARD</a>
                    <a href="#gallery" class="nav-link-item">ARCHIVE</a>
                    <a href="#updates" class="nav-link-item">LOGS</a>
                    <a href="#" id="logout-btn" class="nav-link-item logout-red">TERMINATE SESSION</a>
                </div>
            </div>
        </nav>

        <main class="content">
            <section id="home" class="page active">
                <div class="dashboard-grid">
                    <div class="card wide">
                        <div class="card-head">// RADAR_UPLINK.exe</div>
                        <div class="stat-row">
                            <span>TEMP: <span id="w-temp" class="highlight">--</span>°C</span>
                            <span>HUM: <span id="w-hum" class="highlight">--</span>%</span>
                        </div>
                        <div class="radar-box">
                            <iframe id="radar-iframe" frameborder="0"></iframe>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-head">// OPERATOR_INFO</div>
                        <div id="user-profile" class="profile-container">
                            <img id="user-avatar" src="" alt="">
                            <div class="profile-text">
                                <h2 id="user-name">---</h2>
                                <span class="status-online">SECURE CONNECTION</span>
                            </div>
                        </div>
                    </div>

                    <div class="card full">
                        <div class="card-head">// COMMS_WIDGET</div>
                        <iframe src="https://discord.com/widget?id=1129433598253084826&theme=dark" width="100%" height="300" frameborder="0"></iframe>
                    </div>
                </div>
            </section>
        </main>

        <footer class="bottom-bar">
            <div class="footer-copy">AEGIS GLOBAL DEFENSE // OPS-CENTER 2026</div>
        </footer>
    </div>

    <script src="theme.js"></script>
</body>
</html>
