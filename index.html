<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGD OPERATIONS CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --text: #e0e6ed;
            --accent: #00f0ff;
            --accent-dim: rgba(0, 240, 255, 0.15);
            --border: rgba(0, 240, 255, 0.2);
            --card-bg: rgba(10, 15, 20, 0.85);
            --error: #ff4444;
        }

        body.light-theme {
            --bg: #f4f7fa;
            --text: #1e293b;
            --accent: #0284c7;
            --accent-dim: rgba(2, 132, 199, 0.1);
            --border: rgba(2, 132, 199, 0.2);
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100%;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        /* --- LOGIN SCREEN --- */
        #welcome-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #0a121a 0%, #000 100%);
            z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }

        .login-box {
            text-align: center;
            padding: 50px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }

        .welcome-logo { width: 100px; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--accent)); }

        .glitch-text {
            font-family: 'Orbitron';
            font-size: 1.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        .main-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 30px;
            font-family: 'Orbitron';
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .main-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent);
        }

        /* --- DASHBOARD NAVIGATION --- */
        .glass-nav {
            display: flex; justify-content: space-between; align-items: center;
            height: 65px; padding: 0 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
        }

        .brand { font-family: 'Orbitron'; font-weight: bold; color: var(--accent); font-size: 0.9rem; }

        .nav-controls button {
            background: none; border: 1px solid var(--border);
            color: var(--accent); padding: 6px 12px;
            margin-left: 8px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.7rem;
        }

        /* --- DASHBOARD CONTENT --- */
        .content { padding: 20px; max-width: 1400px; margin: 0 auto; }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 1000px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
            .card.wide { grid-column: span 2; }
            .card.full { grid-column: span 3; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            position: relative;
        }

        .card-header {
            font-family: 'Orbitron';
            color: var(--accent);
            font-size: 0.75rem;
            margin-bottom: 15px;
            border-left: 3px solid var(--accent);
            padding-left: 10px;
        }

        .radar-box {
            height: 350px; background: #000;
            border: 1px solid var(--border);
        }

        .profile-info { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--accent); }
        .status-tag { color: #00ff00; font-size: 0.7rem; font-weight: bold; }

        /* EFFEKTE */
        .blink { animation: blink-anim 1.5s infinite; }
        @keyframes blink-anim { 50% { opacity: 0.3; } }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 240, 255, 0.03) 50%);
            background-size: 100% 4px; z-index: 10001; pointer-events: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <div id="welcome-screen">
        <div class="login-box">
            <img src="assets/AGDlogo.gif" class="welcome-logo" alt="AGD">
            <h1 class="glitch-text">AGD OPS CENTER</h1>
            <p style="font-size: 0.8rem; letter-spacing: 2px;">SECURE UPLINK REQUIRED</p>
            <button id="login-btn" class="main-btn">LOGIN VIA DISCORD</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <nav class="glass-nav">
            <div class="brand">AGD // <span class="blink">SYSTEMS</span></div>
            <div class="nav-controls">
                <button onclick="toggleTheme()">THEME</button>
                <button onclick="logout()" style="border-color: var(--error); color: var(--error);">LOGOUT</button>
            </div>
        </nav>

        <main class="content">
            <div class="grid">
                <div class="card wide">
                    <div class="card-header">// RADAR_FEED.exe</div>
                    <div style="margin-bottom: 10px; font-size: 0.9rem;">
                        STATION: <span id="w-loc" style="color: var(--accent);">DETECTION...</span> | 
                        TEMP: <span id="w-temp">--</span>°C
                    </div>
                    <div class="radar-box">
                        <iframe id="radar-frame" src="" width="100%" height="100%" frameborder="0"></iframe>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">// OPERATOR_PROFILE</div>
                    <div class="profile-info">
                        <img id="u-avatar" class="avatar" src="" alt="?">
                        <div>
                            <div id="u-name" style="font-weight: bold; font-size: 1.1rem;">---</div>
                            <div class="status-tag">ACCESS GRANTED</div>
                        </div>
                    </div>
                </div>

                <div class="card full">
                    <div class="card-header">// DISCORD_COMMUNICATION</div>
                    <iframe src="https://discord.com/widget?id=1129433598253084826&theme=dark" width="100%" height="300" allowtransparency="true" frameborder="0"></iframe>
                </div>
            </div>
        </main>
    </div>

    <script>
        const CLIENT_ID = '1292148049358884905';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        // --- AUTH LOGIK ---
        async function initAuth() {
            const hash = new URLSearchParams(window.location.hash.slice(1));
            let token = hash.get('access_token') || localStorage.getItem('agd_token');

            if (token) {
                try {
                    const response = await fetch('https://discord.com/api/users/@me', {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    
                    if (!response.ok) throw new Error("Auth failed");
                    const user = await response.json();

                    localStorage.setItem('agd_token', token);
                    showApp(user);
                } catch (err) {
                    localStorage.removeItem('agd_token');
                    console.error(err);
                }
                window.history.replaceState({}, document.title, REDIRECT_URI);
            }
        }

        function showApp(user) {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('u-name').innerText = user.username.toUpperCase();
            if(user.avatar) {
                document.getElementById('u-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
            }
            loadWeatherData();
        }

        // --- SYSTEM DATEN ---
        function loadWeatherData() {
            // Standardmäßig Berlin, falls Ortung abgelehnt wird
            let lat = 52.52, lon = 13.40;

            navigator.geolocation.getCurrentPosition(async (pos) => {
                lat = pos.coords.latitude;
                lon = pos.coords.longitude;
                updateDisplay(lat, lon);
            }, () => updateDisplay(lat, lon));
        }

        async function updateDisplay(lat, lon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await res.json();
                document.getElementById('w-temp').innerText = Math.round(data.current_weather.temperature);
                document.getElementById('w-loc').innerText = `${lat.toFixed(2)}N ${lon.toFixed(2)}E`;
                document.getElementById('radar-frame').src = `https://embed.windy.com/embed2.html?lat=${lat}&lon=${lon}&zoom=6&overlay=rain`;
            } catch (e) {}
        }

        // --- CONTROLS ---
        document.getElementById('login-btn').onclick = () => {
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
        };

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        function logout() {
            localStorage.removeItem('agd_token');
            window.location.reload();
        }

        // Start
        initAuth();
    </script>
</body>
</html>
