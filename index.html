<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AGD // OPERATIONS CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --accent: #00f0ff; --panel: rgba(15, 20, 30, 0.85); }
        body { margin: 0; background: var(--bg); color: #e6edf3; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }

        /* Login */
        #login-screen { position: fixed; inset: 0; z-index: 5000; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #logo-img { width: 350px; margin-bottom: 30px; filter: drop-shadow(0 0 10px var(--accent)); }
        .btn-ui { padding: 15px 40px; background: transparent; border: 1px solid var(--accent); color: var(--accent); cursor: pointer; text-transform: uppercase; font-family: 'Orbitron'; letter-spacing: 2px; transition: 0.3s; }
        .btn-ui:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }

        /* Navigation */
        #app { display: none; }
        .sidebar { position: fixed; left: -260px; top: 0; width: 250px; height: 100%; background: #0a0e14; border-right: 1px solid #222; transition: 0.4s; z-index: 3000; padding-top: 80px; }
        .sidebar.active { left: 0; }
        .nav-link { padding: 20px; cursor: pointer; color: #fff; font-family: 'Orbitron'; text-transform: uppercase; border-bottom: 1px solid #111; transition: 0.2s; }
        .nav-link:hover { background: #161b22; color: var(--accent); }

        /* Top Bar */
        .top-bar { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 2000; box-sizing: border-box; }
        .menu-icon { cursor: pointer; color: var(--accent); font-size: 20px; font-family: 'Orbitron'; }
        .profile-section { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent); cursor: pointer; }
        .user-dropdown { position: absolute; top: 65px; right: 20px; background: #000; border: 1px solid #333; display: none; padding: 10px; }
        .user-dropdown.show { display: block; }

        /* Content */
        .main-content { margin: 80px auto; padding: 20px; max-width: 900px; }
        .page { display: none; background: var(--panel); border: 1px solid #1f2937; padding: 30px; border-radius: 12px; }
        h1, h2 { color: var(--accent); font-family: 'Orbitron'; }
    </style>
</head>
<body>

    <div id="login-screen">
        <img id="logo-img" src="https://i.imgur.com/W8he4kN.gif" alt="AGD Logo">
        <button class="btn-ui" onclick="login()">Establish Uplink</button>
    </div>

    <div id="app">
        <div class="top-bar">
            <div class="menu-icon" onclick="toggleSidebar()">☰ MENU</div>
            <div class="profile-section">
                <button class="btn-ui" style="padding:5px 10px; font-size: 12px;" onclick="toggleLang()">DE / EN</button>
                <img id="avatar" class="avatar" src="" onclick="toggleUserMenu()">
                <div id="user-menu" class="user-dropdown">
                    <div style="color:#ff4444; cursor:pointer;" onclick="logout()">LOGOUT</div>
                </div>
            </div>
        </div>

        <div id="sidebar" class="sidebar">
            <div class="nav-link" onclick="showPage('home')">Home</div>
            <div class="nav-link" onclick="showPage('history')">History</div>
            <div class="nav-link" onclick="showPage('credits')">Credits</div>
        </div>

        <main class="main-content">
            <div id="page-home" class="page" style="display:block;">
                <h1 data-de="Willkommen bei AGD" data-en="Welcome to AGD">Welcome to AGD</h1>
                <p>Looking for a friendly space to <strong>CONNECT</strong> with <strong>LIKE-MINDED</strong> people? ...</p>
            </div>
            <div id="page-history" class="page">
                <h2>The Rise of Aegis Global Defense</h2>
                <p>Before Aegis Global Defense ever stood on its own...</p>
            </div>
            <div id="page-credits" class="page">
                <h2>Credits</h2>
                <p>Architecture: Hayato</p>
            </div>
        </main>
    </div>

    <script>
        const CLIENT_ID = '1292148049358884905';
        let lang = 'en';

        // Auth
        function login() { window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(window.location.origin + window.location.pathname)}&response_type=token&scope=identify`; }
        function logout() { localStorage.clear(); location.reload(); }

        // UI
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function toggleUserMenu() { document.getElementById('user-menu').classList.toggle('show'); }
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('page-' + id).style.display = 'block';
            toggleSidebar();
        }

        // Language Switcher
        function toggleLang() {
            lang = lang === 'en' ? 'de' : 'en';
            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerText = el.getAttribute('data-' + lang);
            });
        }

        // Check Auth
        async function init() {
            const hash = new URLSearchParams(window.location.hash.slice(1));
            const token = hash.get('access_token') || localStorage.getItem('token');
            if (token) {
                localStorage.setItem('token', token);
                const res = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } });
                const user = await res.json();
                document.getElementById('avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            }
        }
        init();
    </script>
</body>
</html>
