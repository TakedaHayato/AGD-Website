<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGD // OPERATIONS CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117; --text: #e6edf3; --accent: #00f0ff;
            --border: #30363d; --card-bg: #161b22;
        }
        body.light-theme {
            --bg: #f0f4f8; --text: #1a202c; --accent: #0284c7;
            --border: #cbd5e1; --card-bg: #ffffff;
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); height: 100%; overflow-x: hidden; }

        /* --- NAVIGATION --- */
        .glass-nav { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 65px; background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 9999; }
        .brand { font-family: 'Orbitron'; color: var(--accent); font-weight: bold; font-size: 0.9rem; cursor: pointer; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        
        .hamburger { cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
        .hamburger span { width: 20px; height: 2px; background: var(--accent); }

        .dropdown { position: absolute; top: 55px; right: 20px; background: var(--card-bg); border: 1px solid var(--border); min-width: 180px; display: none; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 10000; }
        .dropdown.active { display: flex; }
        .dropdown a { padding: 12px 20px; color: var(--text); text-decoration: none; font-family: 'Orbitron'; font-size: 0.7rem; border-bottom: 1px solid var(--border); }
        .dropdown a:hover { background: var(--accent); color: #000; }

        /* --- DASHBOARD GRID --- */
        .content { padding: 25px; max-width: 1400px; margin: 0 auto; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        @media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .page { display: none; }
        .page.active { display: block; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
        .card-head { font-family: 'Orbitron'; color: var(--accent); border-left: 3px solid var(--accent); padding-left: 10px; margin-bottom: 20px; font-size: 0.8rem; text-transform: uppercase; }

        /* --- USER PROFILE WIDGET (RECHTS) --- */
        .user-profile-widget { display: flex; flex-direction: column; align-items: flex-end; text-align: right; margin-top: 10px; }
        .user-info-row { display: flex; align-items: center; gap: 15px; }
        .user-name-glitch { font-family: 'Orbitron'; color: var(--accent); font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; }
        .user-pfp { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        .status-code-stream { font-family: monospace; font-size: 0.7rem; color: var(--accent); opacity: 0.8; margin-top: 8px; font-weight: bold; }

        /* --- ELEMENTS --- */
        .radar-box { height: 450px; background: #000; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
        .team-avatar { width: 48px; height: 48px; border-radius: 4px; border: 1px solid var(--border); }

        /* --- LOGIN --- */
        #welcome-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-btn { background: var(--accent); color: #000; border: none; padding: 15px 40px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body onclick="closeMenu()">

    <div id="welcome-screen">
        <button class="login-btn" onclick="login()">ESTABLISH UPLINK</button>
    </div>

    <div id="main-interface" class="hidden">
        <nav class="glass-nav">
            <div class="brand" onclick="showPage('home')">AGD // OPERATIONS CENTER</div>
            <div class="nav-right">
                <div class="hamburger" onclick="toggleMenu(event)">
                    <span></span><span></span><span></span>
                </div>
                <div id="dropdown" class="dropdown">
                    <a href="#" onclick="showPage('home')">DASHBOARD</a>
                    <a href="#" onclick="showPage('credits')">CREDITS</a>
                    <a href="#" onclick="logout()" style="color:#ff4444;">DISCONNECT</a>
                </div>
            </div>
        </nav>

        <main class="content">
            <section id="home" class="page active">
                <div class="dashboard-grid">
                    <div class="main-col">
                        <div class="card">
                            <div class="card-head">// TACTICAL RADAR</div>
                            <div class="radar-box">
                                <iframe id="radar-frame" width="100%" height="100%" frameborder="0" src="https://embed.windy.com/embed2.html?lat=52.52&lon=13.40&zoom=6&overlay=rain&message=false"></iframe>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-head">// LIVE COMMUNICATIONS</div>
                            <iframe src="https://discord.com/widget?id=1129433598253084826&theme=dark" width="100%" height="400" frameborder="0"></iframe>
                        </div>
                    </div>

                    <div class="side-col">
                        <div class="card">
                            <div class="card-head">// SESSION_DATA</div>
                            <div class="user-profile-widget">
                                <div class="user-info-row">
                                    <span id="display-name" class="user-name-glitch">LOADING...</span>
                                    <img id="display-avatar" class="user-pfp" src="">
                                </div>
                                <div id="code-stream" class="status-code-stream">BATT_LEVEL_OK // J2WGVU</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="credits" class="page">
                <div class="card">
                    <div class="card-head">// CORE TEAM</div>
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img class="team-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png">
                            <div><strong>Hayato</strong><br><span style="font-size: 0.8rem; color: var(--accent);">Owner / Lead Dev</span></div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img class="team-avatar" src="https://cdn.discordapp.com/embed/avatars/1.png">
                            <div><strong>Lionel</strong><br><span style="font-size: 0.8rem; color: var(--accent);">Developer (ID: 1400867817951072428)</span></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const CLIENT_ID = '1292148049358884905';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        // Code Stream Animation
        function startCodeStream() {
            const stream = document.getElementById('code-stream');
            const statuses = ["BATT_LEVEL_OK", "UPLINK_STABLE", "ENCRYPT_ACTIVE", "DATA_SYNC_ON"];
            setInterval(() => {
                const status = statuses[Math.floor(Math.random() * statuses.length)];
                const code = Math.random().toString(36).substring(7).toUpperCase();
                stream.innerText = `${status} // ${code}`;
            }, 2000);
        }

        function toggleMenu(e) { e.stopPropagation(); document.getElementById('dropdown').classList.toggle('active'); }
        function closeMenu() { document.getElementById('dropdown').classList.remove('active'); }
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            closeMenu();
        }

        async function init() {
            const hash = new URLSearchParams(window.location.hash.slice(1));
            let token = hash.get('access_token') || localStorage.getItem('agd_token');

            if (token) {
                try {
                    const res = await fetch('https://discord.com/api/users/@me', {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    const user = await res.json();
                    localStorage.setItem('agd_token', token);
                    
                    document.getElementById('welcome-screen').classList.add('hidden');
                    document.getElementById('main-interface').classList.remove('hidden');
                    
                    // Dashboard Rechts Update
                    document.getElementById('display-name').innerText = user.username.toUpperCase();
                    document.getElementById('display-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
                    
                    startCodeStream();
                } catch (e) { localStorage.removeItem('agd_token'); }
                window.history.replaceState({}, document.title, REDIRECT_URI);
            }
        }

        function login() {
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify+guilds.join`;
        }
        function logout() { localStorage.removeItem('agd_token'); window.location.reload(); }

        init();
    </script>
</body>
</html>
