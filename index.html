<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGD // OPERATIONS CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a; --text: #e6edf3; --accent: #00f0ff;
            --border: #1f2937; --card-bg: #0d1117; --terminal-green: #00ff41;
        }
        body.light-theme {
            --bg: #f0f4f8; --text: #1a202c; --accent: #0284c7;
            --border: #cbd5e1; --card-bg: #ffffff; --terminal-green: #0369a1;
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); height: 100%; transition: 0.3s; overflow-x: hidden; }

        /* --- LOGIN SCREEN --- */
        #welcome-screen {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
        }
        .login-logo { width: 300px; height: 300px; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }

        /* --- NAVIGATION --- */
        .glass-nav { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 70px; background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 9999; }
        .brand { font-family: 'Orbitron'; color: var(--accent); font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        
        .nav-controls { display: flex; align-items: center; gap: 10px; }
        .nav-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; font-family: 'Orbitron'; font-size: 0.65rem; cursor: pointer; border-radius: 4px; transition: 0.2s; text-transform: uppercase; text-decoration: none; display: inline-block; }
        .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* --- DASHBOARD --- */
        .content { padding: 20px; max-width: 1600px; margin: 0 auto; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 400px; gap: 20px; }
        @media (max-width: 1100px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; border-radius: 4px; }
        .card-head { font-family: 'Orbitron'; color: var(--accent); border-left: 3px solid var(--accent); padding-left: 10px; margin-bottom: 15px; font-size: 0.8rem; text-transform: uppercase; }

        .team-member { display: flex; align-items: center; gap: 15px; padding: 15px; background: rgba(128,128,128,0.05); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
        .team-pfp { width: 75px; height: 75px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }

        .terminal-container { background: #000 !important; border: 1px solid var(--border); height: 250px; font-family: 'Courier New', monospace; font-size: 0.75rem; color: var(--terminal-green); padding: 10px; overflow: hidden; position: relative; }
        #terminal-log { display: flex; flex-direction: column; position: absolute; bottom: 10px; width: 95%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <img src="AGDlogo.gif" alt="AGD Logo" class="login-logo">
        <button class="nav-btn" style="padding:15px 30px; font-size:0.9rem;" onclick="login()">ESTABLISH UPLINK</button>
    </div>

    <div id="main-interface" class="hidden">
        <nav class="glass-nav">
            <div class="brand" onclick="showPage('home')">AGD // OPS</div>
            <div class="nav-controls">
                <button class="nav-btn" onclick="showPage('home')">Home</button>
                <a href="https://ptb.discord.com/channels/1129433598253084826/1380566062357282946" target="_blank" class="nav-btn">Contact</a>
                <button class="nav-btn" id="lang-btn" onclick="toggleLang()">EN</button>
                <button class="nav-btn" onclick="toggleTheme()">🌓</button>
                <button class="nav-btn" onclick="logout()" style="color:#ff4444;">Logout</button>
            </div>
        </nav>

        <main class="content">
            <section id="home" class="page active">
                <div class="dashboard-grid">
                    <div class="main-col">
                        <div class="card">
                            <div class="card-head t-radar">// TACTICAL_RADAR</div>
                            <iframe width="100%" height="450" frameborder="0" src="https://embed.windy.com/embed2.html?lat=52.52&lon=13.40&zoom=6&overlay=rain"></iframe>
                        </div>
                        <div class="card">
                            <div class="card-head t-comm">// LIVE_COMMUNICATIONS</div>
                            <iframe src="https://discord.com/widget?id=1129433598253084826&theme=dark" width="100%" height="400" frameborder="0"></iframe>
                        </div>
                    </div>
                    <div class="side-col">
                        <div class="card">
                            <div class="card-head t-auth">// AUTH_STATUS</div>
                            <div style="display:flex; align-items:center; justify-content:flex-end; gap:15px; margin-bottom:15px;">
                                <span id="display-name" style="font-family:Orbitron; font-weight:bold; color:var(--accent);">---</span>
                                <img id="display-avatar" style="width:60px; height:60px; border-radius:50%; border:2px solid var(--accent);" src="https://cdn.discordapp.com/embed/avatars/0.png">
                            </div>
                            <div class="terminal-container">
                                <div id="terminal-log"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const CLIENT_ID = '1292148049358884905';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        function showInterface() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('main-interface').classList.remove('hidden');
            startTerminal();
        }

        function login() { 
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`; 
        }

        function logout() { 
            localStorage.removeItem('agd_token'); 
            window.location.reload(); 
        }

        async function init() {
            const hash = new URLSearchParams(window.location.hash.slice(1));
            let token = hash.get('access_token') || localStorage.getItem('agd_token');
            
            if (token) {
                localStorage.setItem('agd_token', token);
                // Entferne Token aus der URL für saubere Optik
                window.history.replaceState({}, document.title, REDIRECT_URI);
                
                try {
                    const res = await fetch('https://discord.com/api/users/@me', { 
                        headers: { Authorization: `Bearer ${token}` } 
                    });
                    if (res.ok) {
                        const user = await res.json();
                        document.getElementById('display-name').innerText = user.username.toUpperCase();
                        const isGif = user.avatar && user.avatar.startsWith('a_');
                        document.getElementById('display-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${isGif ? 'gif' : 'png'}?size=128`;
                        showInterface();
                    } else {
                        throw new Error("Token ungültig");
                    }
                } catch (e) {
                    console.error("Auth-Fehler:", e);
                    localStorage.removeItem('agd_token');
                    // Trotz Fehler Interface zeigen, damit man nicht stuck ist
                    showInterface(); 
                }
            }
        }

        function startTerminal() {
            const log = document.getElementById('terminal-log');
            if(!log) return;
            const lines = ["UPLINK_STABLE", "NODE_ACTIVE", "ENCRYPTING...", "SYNC_OK", "SYSTEM_SECURE"];
            setInterval(() => {
                const div = document.createElement('div');
                div.innerText = `> ${lines[Math.floor(Math.random() * lines.length)]} [${Math.random().toString(16).substring(2,5).toUpperCase()}]`;
                log.appendChild(div);
                if (log.children.length > 8) log.removeChild(log.firstChild);
            }, 800);
        }

        function toggleTheme() { document.body.classList.toggle('light-theme'); }
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Init beim Laden starten
        window.onload = init;
    </script>
</body>
</html>
