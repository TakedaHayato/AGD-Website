<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGD // OPERATIONS CENTER</title>
    
    <link rel="icon" type="image/gif" href="https://i.imgur.com/W8he4kN.gif">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --accent: #00f0ff; --panel: rgba(15, 20, 30, 0.95); --text: #e6edf3; --border: rgba(255, 255, 255, 0.1); }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; justify-content: center; overflow-x: hidden; }
        
        /* Login-Screen: Komplett sauberer, tiefschwarzer Hintergrund ohne GIF-Überreste */
        #login-screen { 
            position: fixed; 
            inset: 0; 
            z-index: 5000; 
            background: #000000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        .logo-login { width: 200px; margin-bottom: 20px; }
        .login-btn { padding: 15px 40px; background: transparent; border: 2px solid var(--accent); color: var(--accent); font-family: 'Orbitron'; font-size: 1.2rem; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .login-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }

        #app { display: none; width: 100%; max-width: 900px; padding: 100px 20px 50px 20px; box-sizing: border-box; }
        .top-bar { position: fixed; top: 0; width: 100%; max-width: 900px; height: 70px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box; border-bottom: 1px solid var(--border); z-index: 2000; }
        #lang-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 5px 10px; cursor: pointer; font-family: 'Orbitron'; }
        
        .sidebar { position: fixed; left: -300px; top: 0; width: 260px; height: 100%; background: var(--panel); border-right: 1px solid var(--border); transition: 0.4s; z-index: 3000; padding-top: 100px; }
        .sidebar.active { left: 0; }
        .nav-link { padding: 20px 30px; cursor: pointer; color: #fff; font-family: 'Orbitron'; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-link:hover { background: rgba(0, 240, 255, 0.1); color: var(--accent); }

        .page { display: none; padding: 30px; border-radius: 15px; background: rgba(15, 20, 30, 0.9); border: 1px solid var(--border); margin-top: 20px; max-height: 75vh; overflow-y: auto; line-height: 1.6; }
        .page h3 { color: var(--accent); font-family: 'Orbitron'; margin-bottom: 15px; font-size: 1.4rem; }
        .page p { font-size: 1.1rem; margin-bottom: 15px; color: #d1d9e0; }
        
        h1, h2 { color: var(--accent); font-family: 'Orbitron'; text-transform: uppercase; margin-top: 0; }
        .card { background: rgba(255,255,255,0.03); padding: 20px; border: 1px solid var(--border); display: block; color: inherit; text-decoration: none; border-radius: 10px; transition: 0.3s; margin-bottom: 15px; }
        .card:hover { border-color: var(--accent); background: rgba(0,240,255,0.05); }
        
        button { cursor: pointer; font-family: 'Orbitron'; padding: 10px 20px; background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        button:hover { background: var(--accent); color: #000; }
        .profile-dropdown { position: absolute; top: 70px; right: 20px; background: var(--panel); border: 1px solid var(--border); display: none; width: 120px; padding: 10px; z-index: 4000; text-align: center; }
        .content-block { margin-top: 20px; }
        
        /* Listen-Styling angelehnt an das neue UI-Design */
        .spec-list { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .spec-list li { font-size: 1.1rem; margin-bottom: 12px; color: #e6edf3; }
        .spec-list strong { color: #fff; }
        .box-design { border-top: 1px solid var(--border); padding-top: 25px; margin-top: 25px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <img src="https://i.imgur.com/W8he4kN.gif" class="logo-login" alt="AGD Logo">
        <button class="login-btn" onclick="login()">ESTABLISH UPLINK</button>
    </div>

    <div id="app">
        <div class="top-bar">
            <div style="display: flex; align-items: center; gap: 20px;">
                <div style="cursor: pointer; color: var(--accent);" onclick="toggleSidebar()">MENU ☰</div>
                <button onclick="toggleLang()" id="lang-btn">EN</button>
            </div>
            <img id="avatar" onclick="toggleProfile()" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent); cursor: pointer;" src="">
            <div id="profile-dropdown" class="profile-dropdown">
                <div style="color: #ff4444; font-size: 0.9rem; cursor: pointer; padding: 10px;" onclick="logout()">LOGOUT</div>
            </div>
        </div>

        <div id="sidebar" class="sidebar">
            <div class="nav-link" onclick="showPage('home')" data-i18n="nav_home">Home</div>
            <div class="nav-link" onclick="showPage('active')" data-i18n="nav_official">Official</div>
            <div class="nav-link" onclick="showPage('history')" data-i18n="nav_history">History</div>
            <div class="nav-link" onclick="showPage('credits')" data-i18n="nav_credits">Credits</div>
            <div class="nav-link" onclick="showPage('legal')" data-i18n="nav_legal">Legal</div>
        </div>

        <main>
            <div id="page-home" class="page" style="display:block;">
                <div style="text-align: center;">
                    <img src="https://i.imgur.com/W8he4kN.gif" style="width: 130px; margin-bottom: 15px;" alt="AGD Logo">
                    <h1 data-i18n="h_title">AGD OPERATIONAL STATUS</h1>
                    <p style="color: var(--accent); font-family: 'Orbitron'; font-size: 0.9rem; letter-spacing: 1px;">UPLINK STABLE // SYSTEMS ONLINE</p>
                </div>
                
                <div id="home-content" class="content-block"></div>
                
                <div style="text-align: center; margin-top: 35px;">
                    <button onclick="window.open('https://discord.gg/mDZRkgxpGb', '_blank')" data-i18n="btn_join">JOIN US</button>
                </div>
            </div>

            <div id="page-active" class="page"><h2 data-i18n="nav_official">Official</h2><div id="active-content"></div></div>
            <div id="page-history" class="page"><h2 data-i18n="nav_history">History</h2><div id="hist-content"></div></div>
            <div id="page-credits" class="page"><h2 data-i18n="nav_credits">Credits</h2><div id="credits-content"></div></div>
            <div id="page-legal" class="page"><h2 data-i18n="nav_legal">Legal</h2><div id="legal-content"></div></div>
        </main>
    </div>

    <script>
        const CLIENT_ID = '1292148049358884905'; 
        
        // Lokalisierte Inhalte angepasst an das modernisierte Text-Layout (Screenshot 2)
        const content = {
            en: {
                nav_home: "Home", nav_official: "Official", nav_history: "History", nav_credits: "Credits", nav_legal: "Legal",
                h_title: "AEGIS GLOBAL DEFENSE (AGD)", btn_join: "JOIN THE FUN TODAY!",
                home_html: `
                    <p>Looking for a friendly space to <strong>CONNECT</strong> with <strong>LIKE-MINDED</strong> people? Look no further! We're all about keeping it chill, but still making things exciting. The future of teamwork, tactics, and community starts here.</p>
                    
                    <h3>🛡️ Why join AGD?</h3>
                    <ul class="spec-list">
                        <li>🎉・<strong>Unique Giveaways</strong> — Regular and exciting rewards for our members.</li>
                        <li>🤝・<strong>Active Community</strong> — There is always someone to chat or hang out with.</li>
                        <li>🤗・<strong>Friendly & Supportive</strong> — A respectful environment where everyone feels welcome.</li>
                        <li>⚡・<strong>Fast-Paced & Exciting</strong> — Boredom? Not on our watch!</li>
                        <li>🌈・<strong>LGBTQ+ Friendly</strong> — A safe, inclusive space for everyone.</li>
                        <li>💎・<strong>Server Boosters</strong> — We are actively looking for boosters (with exclusive perks)!</li>
                        <li>🤝・<strong>Partnerships</strong> — We are open to partnering up with other communities.</li>
                        <li>🎮・<strong>Games & Anime</strong> — Talk about your favorite shows and find your next gaming squad.</li>
                    </ul>
                    
                    <div class="box-design">
                        <h3>📝 Requirements</h3>
                        <p style="font-size: 0.95rem; color: #8b949e; margin-bottom: 15px;">To keep our community safe and fun, we ask that you:</p>
                        <ul class="spec-list">
                            <li>✅・<strong>Discord ToS</strong> — Follow the official Discord Terms of Service and our server rules.</li>
                            <li>✅・<strong>Mindset</strong> — Show respect, discipline, and common sense.</li>
                            <li>✅・<strong>Languages</strong> — Speak decent English or German.</li>
                        </ul>
                    </div>
                `,
                active: `<a href="https://www.roblox.com/games/4639625707/War-Tycoon" target="_blank" class="card"><h3>War Tycoon</h3><p>Operating as AGD.</p></a><a href="https://warthunder.com/de/" target="_blank" class="card"><h3>War Thunder</h3><p>Sechenov’s Legion (SCNV).</p></a>`,
                hist: `
                    <h3>The Rise of Aegis Global Defense</h3>
                    <p>Before Aegis Global Defense ever stood on its own, it was allied with the Aegis Global Task Force. Together, they operated as a powerful force—but alliances don’t always last. Tensions grew, disagreements escalated, and eventually, a war broke out between the two sides.</p>
                    <p>In the streets of Emergency Hamburg, the goal was clear: fight against gangs and restore peace. Amid chaos and rising violence, three founders—Hayato, Nemesis, and Tim—came together on July 14th, 2023. They were building something new: <strong>Aegis Global Defense (AGD).</strong></p>
                    <p>When the group later expanded into War Tycoon, their vision became even clearer: They didn’t just want to win. They wanted to create something bigger: a force dedicated to order, strength, and above all, peace.</p>
                    <p>Years passed, and by 2026, AGD had grown beyond its original scope. A new division was formed: Sechenov’s Legion (SCNV), bringing a new level of discipline to War Thunder. It was only the beginning.</p>
                    <p>In 2026, AGD faced a heavy loss. Founder Tim (TimTheKeks) stepped away. His departure left a gap that couldn’t truly be filled. Yet, AGD stood firm. The remaining members carried his legacy forward. AGD was never just about its founders; it was about the idea they created together. <strong>And that idea still lives on.</strong></p>
                `,
                credits: "<h3>Credits</h3><p><strong>Main Architecture & Development:</strong> Hayato</p><p><strong>Administration & Strategy:</strong> AGD High Command</p><p><strong>Special Thanks:</strong> To every member who helped build this community.</p>",
                legal: "<h3>Legal & Privacy</h3><p>This is a non-commercial fan project. Aegis Global Defense (AGD) is an independent community group and is not affiliated with, endorsed by, or sponsored by Roblox Corporation, Gaijin Entertainment, or any other game developers. All content is created by fans for fans. Please respect the Discord Terms of Service and our internal server rules at all times.</p>"
            },
            de: {
                nav_home: "Startseite", nav_official: "Offiziell", nav_history: "Geschichte", nav_credits: "Credits", nav_legal: "Rechtliches",
                h_title: "AEGIS GLOBAL DEFENSE (AGD)", btn_join: "TRITT DER ALLIANZ BEI!",
                home_html: `
                    <p>Suchst du einen freundlichen Ort, um dich mit <strong>GLEICHGESINNTEN</strong> zu <strong>VERBINDEN</strong>? Such nicht weiter! Wir halten es entspannt, aber spannend. Die Zukunft von Teamarbeit, Taktik und Community beginnt hier.</p>
                    
                    <h3>🛡️ Warum AGD beitreten?</h3>
                    <ul class="spec-list">
                        <li>🎉・<strong>Einzigartige Giveaways</strong> — Regelmäßige und spannende Belohnungen für unsere Mitglieder.</li>
                        <li>🤝・<strong>Aktive Community</strong> — Es ist immer jemand zum Chatten oder Abhängen da.</li>
                        <li>🤗・<strong>Freundlich & Unterstützend</strong> — Eine respektvolle Umgebung, in der sich jeder willkommen fühlt.</li>
                        <li>⚡・<strong>Schnelllebig & Aufregend</strong> — Langeweile? Nicht unter unserer Aufsicht!</li>
                        <li>🌈・<strong>LGBTQ+ Freundlich</strong> — Ein sicherer, inklusiver Raum für alle.</li>
                        <li>💎・<strong>Server Booster</strong> — Wir suchen aktiv nach Boostern (mit exklusiven Vorteilen)!</li>
                        <li>🤝・<strong>Partnerschaften</strong> — Wir sind offen für Kooperationen mit anderen Communities.</li>
                        <li>🎮・<strong>Spiele & Anime</strong> — Sprich über deine Lieblingsserien und finde dein nächstes Squad.</li>
                    </ul>
                    
                    <div class="box-design">
                        <h3>📝 Anforderungen</h3>
                        <p style="font-size: 0.95rem; color: #8b949e; margin-bottom: 15px;">Um unsere Community sicher und unterhaltsam zu halten, bitten wir dich:</p>
                        <ul class="spec-list">
                            <li>✅・<strong>Discord ToS</strong> — Befolge die offiziellen Discord Nutzungsbedingungen und unsere Serverregeln.</li>
                            <li>✅_<strong>Mindset</strong> — Zeige Respekt, Disziplin und gesunden Menschenverstand.</li>
                            <li>✅・<strong>Sprachen</strong> — Sprich angemessenes Englisch oder Deutsch.</li>
                        </ul>
                    </div>
                `,
                active: `<a href="https://www.roblox.com/games/4639625707/War-Tycoon" target="_blank" class="card"><h3>War Tycoon</h3><p>AGD Einsatzgebiet.</p></a><a href="https://warthunder.com/de/" target="_blank" class="card"><h3>War Thunder</h3><p>Sechenov’s Legion (SCNV).</p></a>`,
                hist: `
                    <h3>Der Aufstieg von Aegis Global Defense</h3>
                    <p>Bevor Aegis Global Defense auf eigenen Beinen stand, war es mit der Aegis Global Task Force verbündet. Zusammen operierten sie als mächtige Streitmacht – doch Allianzen halten nicht ewig. Spannungen wuchsen, Meinungsverschiedenheiten eskalierten und schließlich brach ein Krieg zwischen den beiden Seiten aus.</p>
                    <p>In den Straßen von Emergency Hamburg war das Ziel klar: Kampf gegen Banden und die Wiederherstellung des Friedens. Am 14. Juli 2023 kamen drei Gründer zusammen – Hayato, Nemesis und Tim – und bauten etwas Neues auf: <strong>Aegis Global Defense (AGD).</strong></p>
                    <p>Als sich die Gruppe später auf War Tycoon ausweitete, wurde die Vision klarer: Sie wollten eine Truppe schaffen, die sich der Ordnung, der Stärke und dem Frieden widmet.</p>
                    <p>Bis 2026 war AGD weit gewachsen. Eine neue Division wurde gegründet: Sechenov’s Legion (SCNV) in War Thunder. Es war erst der Anfang.</p>
                    <p>Im Jahr 2026 musste AGD einen schweren Verlust hinnehmen. Der Gründer Tim (TimTheKeks) verließ die Gruppe. Doch anstatt auseinanderzubrechen, blieb AGD standhaft. Die verbleibenden Mitglieder trugen sein Erbe weiter. AGD ging es nie nur um die Gründer. Es ging um die Idee, die sie gemeinsam erschufen. <strong>Und diese Idee lebt weiter.</strong></p>
                `,
                credits: "<h3>Credits</h3><p><strong>Hauptarchitektur & Entwicklung:</strong> Hayato</p><p><strong>Administration & Strategie:</strong> AGD High Command</p><p><strong>Besonderer Dank:</strong> An jedes Mitglied, das half, diese Community aufzubauen.</p>",
                legal: "<h3>Rechtliches & Datenschutz</h3><p>Dies ist ein nicht-kommerzielles Fan-Projekt. Aegis Global Defense (AGD) is eine unabhängige Community-Gruppe und steht in keinerlei Verbindung zu der Roblox Corporation, Gaijin Entertainment oder anderen Spieleentwicklern. Bitte beachte jederzeit die Discord AGB sowie unsere internen Serverregeln.</p>"
            }
        };

        let lang = 'en';

        function updateUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(content[lang][key]) el.innerText = content[lang][key];
            });
            document.getElementById('home-content').innerHTML = content[lang].home_html;
            document.getElementById('active-content').innerHTML = content[lang].active;
            document.getElementById('hist-content').innerHTML = content[lang].hist;
            document.getElementById('credits-content').innerHTML = content[lang].credits;
            document.getElementById('legal-content').innerHTML = content[lang].legal;
            document.getElementById('lang-btn').innerText = lang.toUpperCase();
        }

        function toggleLang() { lang = lang === 'en' ? 'de' : 'en'; updateUI(); }
        function login() { window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(window.location.origin + window.location.pathname)}&response_type=token&scope=identify`; }
        function logout() { window.location.href = window.location.origin + window.location.pathname; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function toggleProfile() { const d = document.getElementById('profile-dropdown'); d.style.display = (d.style.display === 'block' ? 'none' : 'block'); }
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('page-' + id).style.display = 'block';
            toggleSidebar(); document.getElementById('profile-dropdown').style.display = 'none';
        }

        async function init() {
            const hash = new URLSearchParams(window.location.hash.slice(1));
            const token = hash.get('access_token');
            if (token) {
                try {
                    const res = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } });
                    const user = await res.json();
                    if(user.id) {
                        document.getElementById('avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('app').style.display = 'block';
                        updateUI();
                    }
                } catch(e) { logout(); }
            }
        }
        init();
    </script>
</body>
</html>
