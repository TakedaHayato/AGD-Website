<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGD // OPERATIONS CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a; --text: #e6edf3; --accent: #00f0ff;
            --border: #1f2937; --card-bg: #0d1117; --terminal-green: #00ff41;
        }
        /* LIGHT MODE FARBEN */
        body.light-theme {
            --bg: #f0f4f8; --text: #1a202c; --accent: #0284c7;
            --border: #cbd5e1; --card-bg: #ffffff; --terminal-green: #0369a1;
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); height: 100%; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

        /* --- NAVIGATION --- */
        .glass-nav { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; height: 70px; background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 9999; }
        .brand { font-family: 'Orbitron'; color: var(--accent); font-weight: bold; font-size: 1.1rem; letter-spacing: 2px; cursor: pointer; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; position: relative; }
        .nav-btn { background: transparent; border: 1px solid var(--border); color: var(--accent); padding: 8px 15px; font-family: 'Orbitron'; font-size: 0.7rem; cursor: pointer; border-radius: 4px; text-transform: uppercase; transition: 0.2s; }
        .nav-btn:hover { background: var(--accent); color: #000; }

        .hamburger { cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background: transparent; }
        .hamburger span { width: 20px; height: 2px; background: var(--accent); }

        .dropdown { 
            position: absolute; top: 60px; right: 0; background: var(--card-bg); 
            border: 1px solid var(--border); display: none; flex-direction: column; 
            min-width: 220px; z-index: 10001; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .dropdown.active { display: flex; }
        .dropdown a, .dropdown button { 
            padding: 15px; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); 
            font-family: 'Orbitron'; font-size: 0.75rem; text-align: left; background: transparent; border-left: none; border-right: none; border-top: none; cursor: pointer;
        }
        .dropdown a:hover, .dropdown button:hover { background: var(--accent); color: #000; }

        /* --- DASHBOARD GRID --- */
        .content { padding: 25px; max-width: 1800px; margin: 0 auto; min-height: calc(100vh - 70px); }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 450px; gap: 25px; }
        @media (max-width: 1200px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .page { display: none; }
        .page.active { display: block; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 4px; padding: 20px; margin-bottom: 20px; }
        .card-head { font-family: 'Orbitron'; color: var(--accent); border-left: 4px solid var(--accent); padding-left: 12px; margin-bottom: 20px; font-size: 0.9rem; text-transform: uppercase; }

        /* --- USER & TERMINAL --- */
        .user-profile-widget { display: flex; align-items: center; justify-content: flex-end; gap: 20px; margin-bottom: 20px; }
        .user-name-glitch { font-family: 'Orbitron'; color: var(--accent); font-size: 1.5rem; font-weight: bold; }
        .user-pfp { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--accent); background: #000; }

        .terminal-container { background: #000 !important; border: 1px solid var(--border); height: 300px; font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--terminal-green); padding: 15px; overflow: hidden; position: relative; }
        #terminal-log { display: flex; flex-direction: column; gap: 4px; position: absolute; bottom: 15px; width: calc(100% - 30px); }

        /* --- CREDITS --- */
        .team-member { display: flex; align-items: center; gap: 20px; padding: 15px; background: rgba(128,128,128,0.05); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 10px; }
        .team-pfp { width: 65px; height: 65px; border-radius: 8px; border: 1px solid var(--border); background: #000; }

        /* --- ELEMENTS --- */
        .radar-box { height: 500px; background: #000; border: 1px solid var(--border); margin-bottom: 20px; }
        .discord-widget { width: 100%; height: 400px; border: none; border-radius: 4px; background: #000; }
        .login-btn { background: var(--accent); color: #000; border: none; padding: 18px 45px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="welcome-screen" style="position:fixed; inset:0; background:#000; z-index:10000; display:flex; align-items:center; justify-content:center;">
        <button class="login-btn" onclick="login()">ESTABLISH UPLINK</button>
    </div>

    <div id="main-interface" class="hidden">
        <nav class="glass-nav">
            <div class="brand" onclick="showPage('home')">AGD // OPS</div>
            
            <div class="nav-right">
                <button class="nav-btn" onclick="showPage('home')">Home</button>
                
                <div class="hamburger" onclick="toggleMenu(event)">
                    <span></span><span></span><span></span>
                </div>
                <div id="dropdown" class="dropdown">
                    <button onclick="showPage('home')">DASHBOARD</button>
                    <button onclick="showPage('credits')">CREDITS</button>
                    <button onclick="toggleTheme()">DARK / LIGHT MODE</button>
                    <button onclick="logout()" style="color:#ff4444;">DISCONNECT</button>
                </div>
            </div>
        </nav>

        <main class="content">
            <section id="home" class="page active">
                <div class="dashboard-grid">
                    <div class="main-col">
                        <div class="card">
                            <div class="card-head">// TACTICAL_RADAR</div>
                            <div class="radar-box">
                                <iframe width="100%" height="100%" frameborder="0" src="https://embed.windy.com/embed2.html?lat=52.52&lon=13.40&zoom=6&overlay=rain&message=false"></iframe>
                            </div>
                            <div class="card-head">// LIVE_COMMUNICATIONS</div>
                            <iframe class="discord-widget" src="https://discord.com/widget?id=1129433598253084826&theme=dark"></iframe>
                        </div>
                    </div>
                    <div class="side-col">
                        <div class="card">
                            <div class="card-head">// AUTH_STATUS</div>
                            <div class="user-profile-widget">
                                <span id="display-name" class="user-name-glitch">---</span>
                                <img id="display-avatar" class="user-pfp" src="">
                            </div>
                            <div class="terminal-container">
                                <div id="terminal-log"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="credits" class="page">
                <div class="card">
                    <div class="card-head">// PROJECT_STRUCTURE</div>
                    <div id="team-list">
                        <div class="team-member">
                            <img id="credit-hayato" class="team-pfp" src="https://cdn.discordapp.com/avatars/444127208735506433/a_df259e829377488b398646b9a89c927b.gif?size=128">
                            <div><div class="team-name">HAYATO</div><div class="team-role">OWNER / ARCHITECT</div></div>
                        </div>
                        <div class="team-member">
                            <img id="credit-lionel" class="team-pfp" src="https://cdn.discordapp.com/avatars/1400867817951072428/a_e6edf3.gif?size=128">
                            <div><div class="team-name">LIONEL</div><div class="team-role">DEVELOPER (ID: 1400867817951072428)</div></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const CLIENT_ID = '1292148049358884905';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            closeMenu();
        }

        function toggleMenu(e) { 
            e.stopPropagation(); 
            document.getElementById('dropdown').classList.toggle('active'); 
        }
        
        function closeMenu() { 
            document.getElementById('dropdown').classList.remove('active'); 
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            closeMenu();
        }

        function startTerminal() {
            const log = document.getElementById('terminal-log');
            const lines = ["INIT_UPLINK...", "SCANNING_NODES", "ACCESS_GRANTED", "SYNC_COMPLETE", "ENCRYPTING..."];
            setInterval(() => {
                const div = document.createElement('div');
                div.innerText = `> ${lines[Math.floor(Math.random() * lines.length)]} [${Math.random().toString(16).substring(2,6).toUpperCase()}]`;
                log.appendChild(div);
                if (log.children.length > 10) log.removeChild(log.firstChild);
            }, 600);
        }

        async function init() {
            const hash = new URLSearchParams(window.location.hash.slice(1));
            let token = hash.get('access_token') || localStorage.getItem('agd_token');

            if (token) {
                try {
                    const res = await fetch('https://discord.com/api/users/@me', {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    const user = await res.json();
                    localStorage.setItem('agd_token', token);
                    
                    document.getElementById('welcome-screen').classList.add('hidden');
                    document.getElementById('main-interface').classList.remove('hidden');
                    
                    const isGif = user.avatar && user.avatar.startsWith('a_');
                    const pfpUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${isGif ? 'gif' : 'png'}?size=128`;
                    
                    document.getElementById('display-name').innerText = user.username.toUpperCase();
                    document.getElementById('display-avatar').src = pfpUrl;

                    startTerminal();
                } catch (e) { localStorage.removeItem('agd_token'); }
                window.history.replaceState({}, document.title, REDIRECT_URI);
            }
        }

        function login() { window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify+guilds.join`; }
        function logout() { localStorage.removeItem('agd_token'); window.location.reload(); }

        init();
        // Schließt Menü bei Klick auf Content
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.nav-right')) closeMenu();
        });
    </script>
</body>
</html>
