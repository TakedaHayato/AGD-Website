<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGD // OPERATIONS CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #05070a; --text: #e6edf3; --accent: #00f0ff; 
            --card-bg: rgba(13, 17, 23, 0.9); --nav-bg: rgba(0, 0, 0, 0.8);
        }
        body { margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* Splash Screen mit GIF */
        #welcome-screen {
            position: fixed; inset: 0; z-index: 2000;
            background-image: url('AGDlogo.gif');
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: flex-end; padding-bottom: 50px;
        }

        .btn-main {
            background: transparent; color: var(--accent); border: 1px solid var(--accent);
            padding: 15px 40px; font-family: 'Orbitron'; text-transform: uppercase;
            cursor: pointer; transition: 0.3s; letter-spacing: 2px;
        }
        .btn-main:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }

        /* Header & Menüs */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 40px; background: var(--nav-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 1000;
        }
        
        .menu-icon { font-size: 28px; cursor: pointer; color: var(--accent); }
        .dropdown {
            display: none; position: absolute; top: 70px; left: 20px;
            background: #000; border: 1px solid #333; width: 200px; padding: 10px 0;
            border-radius: 8px; z-index: 1001;
        }
        .dropdown div, .dropdown a { padding: 15px 20px; color: #fff; cursor: pointer; font-family: 'Orbitron'; text-transform: uppercase; }
        .dropdown div:hover { background: #1a1a1a; color: var(--accent); }

        /* Profil Bereich */
        .profile-container { position: relative; display: flex; align-items: center; gap: 15px; cursor: pointer; border: 1px solid #333; padding: 5px 15px; border-radius: 20px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent); }
        
        .user-menu {
            display: none; position: absolute; top: 60px; right: 0;
            background: #000; border: 1px solid #333; width: 150px; padding: 10px 0;
            border-radius: 8px; z-index: 2000;
        }
        .user-menu div { padding: 10px 20px; font-family: 'Orbitron'; color: #ff4444; text-align: center; }
        .user-menu div:hover { background: #1a1a1a; }
        .user-menu.show { display: block; }

        .content { max-width: 900px; margin: 40px auto; padding: 20px; }
        .card { background: var(--card-bg); border: 1px solid #1f2937; padding: 30px; border-radius: 12px; margin-bottom: 30px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <button class="btn-main" onclick="login()">ESTABLISH UPLINK</button>
    </div>

    <div id="main-interface" class="hidden">
        <header>
            <div class="menu-icon" onclick="toggleDropdown()">☰</div>
            <div id="dropdown-menu" class="dropdown">
                <div onclick="showPage('home'); toggleDropdown()">Home</div>
                <div onclick="showPage('factions'); toggleDropdown()">Factions</div>
                <div onclick="showPage('history'); toggleDropdown()">History</div>
            </div>

            <div class="profile-container" onclick="toggleUserMenu(event)">
                <img id="user-avatar" class="avatar" src="https://cdn.discordapp.com/embed/avatars/0.png">
                <span id="user-name">Loading...</span>
                <div id="user-menu" class="user-menu">
                    <div onclick="logout()">LOGOUT</div>
                </div>
            </div>
        </header>

        <main class="content">
            <section id="home" class="page">
                <div class="card">
                    <h2>Network Status</h2>
                    <p>Aegis Global Defense Systems Online.</p>
                </div>
                <div class="card">
                    <iframe src="https://discord.com/widget?id=1129433598253084826&theme=dark" width="100%" height="500" frameborder="0"></iframe>
                </div>
            </section>
            <section id="factions" class="page hidden">
                <div class="card"><h2>Current Divisions</h2><p>War Tycoon / SCNV</p></div>
            </section>
            <section id="history" class="page hidden">
                <div class="card"><h2>History</h2><p>AGD Origins...</p></div>
            </section>
        </main>
    </div>

    <script>
        const CLIENT_ID = '1292148049358884905';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        function login() {
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
        }

        function logout() { 
            localStorage.removeItem('token'); 
            window.location.href = window.location.origin + window.location.pathname; // Kompletter Reload
        }

        async function init() {
            const hash = new URLSearchParams(window.location.hash.slice(1));
            const token = hash.get('access_token') || localStorage.getItem('token');
            
            if (token) {
                localStorage.setItem('token', token);
                try {
                    const res = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } });
                    if (!res.ok) throw new Error('Auth failed');
                    const user = await res.json();
                    document.getElementById('user-name').innerText = user.username;
                    document.getElementById('user-avatar').src = user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png';
                    document.getElementById('welcome-screen').style.display = 'none';
                    document.getElementById('main-interface').classList.remove('hidden');
                } catch(e) { logout(); }
            }
        }

        // UI Helpers
        function toggleDropdown() { const d = document.getElementById('dropdown-menu'); d.style.display = (d.style.display === 'block') ? 'none' : 'block'; }
        
        function toggleUserMenu(event) {
            event.stopPropagation(); // WICHTIG: Verhindert, dass das Menü sofort wieder schließt
            document.getElementById('user-menu').classList.toggle('show');
        }

        // Schließt Menüs bei Klick außerhalb
        document.addEventListener('click', () => {
            document.getElementById('user-menu').classList.remove('show');
            document.getElementById('dropdown-menu').style.display = 'none';
        });

        function showPage(id) { 
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden')); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        init();
    </script>
</body>
</html>
