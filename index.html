<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGD // OPERATIONS CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a; --text: #e6edf3; --accent: #00f0ff;
            --border: #1f2937; --card-bg: #0d1117; --terminal-green: #00ff41;
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); height: 100%; transition: 0.3s; overflow-x: hidden; }

        /* --- LOGIN SCREEN --- */
        #welcome-screen { 
            position: fixed; inset: 0; background: #000; z-index: 10000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; 
        }

        /* RUNDES LOGO DESIGN */
        .logo-wrapper {
            width: 250px; height: 250px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .login-logo { width: 100%; height: 100%; object-fit: cover; }

        /* --- NAVIGATION --- */
        .glass-nav { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 70px; background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 9999; }
        .brand { font-family: 'Orbitron'; color: var(--accent); font-weight: bold; cursor: pointer; }
        .nav-controls { display: flex; align-items: center; gap: 10px; }
        .nav-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; font-family: 'Orbitron'; font-size: 0.65rem; cursor: pointer; border-radius: 4px; transition: 0.2s; text-transform: uppercase; text-decoration: none; }
        .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-join { background: rgba(0, 240, 255, 0.1); border-color: var(--accent); color: var(--accent); }

        /* --- CONTENT --- */
        .page { display: none; padding: 20px; max-width: 1600px; margin: 0 auto; }
        .page.active { display: block; }
        .card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; border-radius: 4px; }
        .card-head { font-family: 'Orbitron'; color: var(--accent); border-left: 3px solid var(--accent); padding-left: 10px; margin-bottom: 15px; font-size: 0.8rem; text-transform: uppercase; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="logo-wrapper">
            <img src="AGDlogo.gif" alt="AGD Logo" class="login-logo">
        </div>
        <button class="nav-btn" style="padding:15px 30px; font-size:0.9rem;" onclick="establishUplink()">ESTABLISH UPLINK</button>
    </div>

    <div id="main-interface" class="hidden">
        <nav class="glass-nav">
            <div class="brand" onclick="showPage('home')">AGD // OPS</div>
            <div class="nav-controls">
                <button class="nav-btn" onclick="showPage('home')">Home</button>
                <a href="https://discord.gg/mDZRkgxpGb" target="_blank" class="nav-btn btn-join">Join Server</a>
                <button class="nav-btn" onclick="logout()" style="color:#ff4444;">Disconnect</button>
            </div>
        </nav>

        <main class="content">
            <section id="home" class="page active">
                <div class="card">
                    <h2 style="font-family: 'Orbitron'; color: var(--accent);">SYSTEM STATUS: ONLINE</h2>
                    <p>Willkommen beim AGD Operations Center. Alle Sub-Systeme sind bereit.</p>
                </div>
                <div class="card">
                    <div class="card-head">// TACTICAL_RADAR</div>
                    <iframe width="100%" height="450" frameborder="0" src="https://embed.windy.com/embed2.html?lat=52.52&lon=13.40&zoom=6&overlay=rain"></iframe>
                </div>
            </section>
        </main>
    </div>

    <script>
        function establishUplink() { 
            document.getElementById('welcome-screen').classList.add('hidden'); 
            document.getElementById('main-interface').classList.remove('hidden'); 
        }
        function logout() { location.reload(); }
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
